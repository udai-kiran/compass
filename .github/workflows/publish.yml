name: Publish images

# Build the API, web, and email-worker images and push them to GitHub Container Registry.
# Runs on pushes to main and on version tags; PRs build-only (no push) so a
# fork or branch can't publish. Images land at ghcr.io/<owner>/pennypilot-<app>.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, docker]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, ingestor, extractor]
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so `git describe` can derive a version.
          fetch-depth: 0

      # Human-readable version: nearest tag (e.g. v1.2.0-3-gabc123), else short SHA.
      - id: ver
        run: |
          echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Only log in when we intend to push (not on pull_request).
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name, so PennyPilot -> pennypilot.
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # Push on branch/tag pushes; PRs validate the build without publishing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.ver.outputs.built_at }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
