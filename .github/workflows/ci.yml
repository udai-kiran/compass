name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: [self-hosted, docker]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass-ci
          POSTGRES_DB: compass_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U compass -d compass_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      # No `cache: npm` — these runners are persistent, so ~/.npm survives
      # between jobs. Restoring it from the Actions cache meant downloading a
      # 1.6GB archive at ~2MB/s (~7min) to replace a cache already on disk.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://compass:compass-ci@localhost:${{ job.services.postgres.ports['5432'] }}/compass_ci
      - run: npm test
        env:
          DATABASE_URL: postgres://compass:compass-ci@localhost:${{ job.services.postgres.ports['5432'] }}/compass_ci
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          SESSION_SECRET: ci-only-session-secret-not-a-real-value-0123456789
      - run: npm run build -w apps/web
      - run: npm run build -w apps/docs

  audit:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v5
      # See note in `check` — persistent runners already have ~/.npm.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      # Hard gate: anything that ships in a runtime image.
      - run: npm audit --omit=dev --audit-level=high
      # Informational: dev/build tooling. Non-blocking because the docs
      # generator (@docusaurus -> serve-handler -> minimatch@3) pins an old
      # brace-expansion with no compatible fix available upstream — forcing a
      # newer one breaks `docusaurus serve` at runtime.
      - run: npm audit --audit-level=high
        continue-on-error: true
