name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w apps/web

  audit:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail the build on known high/critical vulnerabilities in dependencies.
      - run: npm audit --audit-level=high
