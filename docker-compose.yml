# App services only — Postgres and Redis are external (see .env) and are
# never part of this stack. All endpoints come from environment variables.
services:
  # One-shot: applies migrations and provisions the owner account, then exits.
  # OWNER_EMAIL/OWNER_PASSWORD come from .env via env_file. Idempotent.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "db:bootstrap", "-w", "apps/api"]
    env_file: .env
    environment:
      NODE_ENV: production
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
      # Caddy proxies to api:3001 — keep the container port fixed.
      PORT: "3001"
      STORAGE_DIR: /data/attachments
      BACKUP_DIR: /data/backups
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Email → transaction pipeline. Both share the external Postgres/Redis from
  # .env. The ingestor reads mail over OAuth2 IMAP and enqueues; the extractor
  # runs the AI extraction and writes the review inbox. Neither serves HTTP.
  # Both are optional — omit them (or leave their env unset) to run without the
  # email pipeline; onboard a mailbox once with:
  #   docker compose run --rm ingestor npm run connect -w apps/ingestor -- <email>
  ingestor:
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  extractor:
    build:
      context: .
      dockerfile: apps/extractor/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
