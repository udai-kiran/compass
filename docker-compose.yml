# App services only — Postgres and Redis are external (see .env) and are
# never part of this stack. All endpoints come from environment variables.
services:
  # One-shot: applies migrations and provisions the owner account, then exits.
  # OWNER_EMAIL/OWNER_PASSWORD come from .env via env_file. Idempotent.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "db:bootstrap", "-w", "apps/api"]
    env_file: .env
    environment:
      NODE_ENV: production
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
      # Caddy proxies to api:3001 — keep the container port fixed.
      PORT: "3001"
      STORAGE_DIR: /data/attachments
      BACKUP_DIR: /data/backups
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Email → transaction pipeline (opt-in). Both share the external Postgres/Redis
  # from .env. The ingestor reads mail over OAuth2 IMAP and enqueues; the
  # extractor runs the AI extraction and writes the review inbox. Neither serves
  # HTTP. They sit behind the `email` profile so a default `docker compose up`
  # (and existing non-AI deployments) never starts them — the extractor requires
  # a real AI_PROVIDER and would otherwise crash-loop. Enable the pipeline with:
  #   docker compose --profile email up -d
  # Mailboxes are onboarded per-user from Settings → Mailboxes (the `connect` CLI
  # runs on the user's own machine, not here) — see the README.
  ingestor:
    profiles: ["email"]
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  extractor:
    profiles: ["email"]
    build:
      context: .
      dockerfile: apps/extractor/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
